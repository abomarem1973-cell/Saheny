name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # إصدار Expo SDK المستخدم (54 مستقر ومجرّب). لا تغيّره إلا لسبب
      EXPO_SDK: "54"
      # مفتاح Claude للتحقق من الصور (اختياري) - يُضاف من Settings > Secrets
      EXPO_PUBLIC_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: إنشاء مشروع Expo وتثبيت الحزم المتوافقة
        run: |
          npx --yes create-expo-app@latest build-app --template blank@sdk-${EXPO_SDK}
          cd build-app
          npx expo install expo-linear-gradient expo-blur expo-haptics expo-font expo-audio expo-camera expo-notifications \
            @expo-google-fonts/cairo @react-native-async-storage/async-storage @react-native-community/datetimepicker \
            react-native-screens react-native-safe-area-context @react-navigation/native @react-navigation/native-stack

      - name: نسخ كود WakeSnap وضبط الإعدادات
        run: |
          cp -r src assets build-app/
          cp App.js build-app/App.js
          cd build-app
          node ../scripts/configure.js app

      - name: توليد مشروع أندرويد
        working-directory: build-app
        run: |
          npx expo prebuild --platform android --no-install
          node ../scripts/configure.js native
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: بناء APK
        working-directory: build-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: WakeSnap-apk
          path: build-app/android/app/build/outputs/apk/release/*.apk
